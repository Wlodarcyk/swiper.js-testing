<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper testing</title>
    <link rel="stylesheet" href="style.css">
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>


</head>
<body>

    <div class="swiper swiper-container">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="swiper-zoom-container">
                <img src="/New Balance 204L Natural.png" alt="">
                </div>
            </div>
             <div class="swiper-slide">
                <img src="/New Balance 204L Silver Metallic Sage Green (1).png" alt="">
            </div>
             <div class="swiper-slide">
                <img src="/New Balance 204L Silver Metallic Sage Green (2).png" alt="">
            </div>
             <div class="swiper-slide">
                <img src="/New Balance 204L Silver Metallic Sage Green (3).png" alt="">
            </div>
           
                    


        </div>

        <div>
            <div class="swiper-pagination"></div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>

    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <script src="main.js"></script>
</body>
</html>
